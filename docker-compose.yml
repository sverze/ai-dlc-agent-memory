# Local services for the real adapters. Start with:  docker compose up -d
# Neo4j browser: http://localhost:7474  (user neo4j / devpassword — LOCAL DEV ONLY;
# override via NEO4J_PASSWORD env + the corresponding NEO4J_AUTH below for anything shared)
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/devpassword
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p devpassword 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
