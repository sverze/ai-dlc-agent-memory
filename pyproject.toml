[project]
name = "agentic-memory"
version = "0.1.0"
description = "Collective agentic memory for AI DLC — V1 prototype (Stage 1: substrate)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# Real provider SDKs — only needed to run against live models. The offline path
# (FakeModelClient + the full default test suite) imports without these.
live = ["anthropic>=0.40", "google-genai>=1.0"]
# Vertex AI Model Garden — both Gemini and Claude under one GCP project (D25).
# anthropic[vertex] pulls google-auth for ADC; google-genai runs in Vertex mode.
# Offline path never needs these (D11).
vertex = ["anthropic[vertex]>=0.40", "google-genai>=1.0"]
# Real temporal graph (L4) — Graphiti over Kuzu (embedded, local dev) or Neo4j
# (shared/demo via docker-compose). Offline path never needs these (D11).
graph = ["graphiti-core[kuzu]>=0.29"]
# Real JIRA ticket source (direct REST per D6). Offline path never needs this (D11).
jira = ["httpx>=0.27"]
# Observability — Langfuse traces per-agent model calls (FR10). Offline = no-op (D11).
observability = ["langfuse>=4,<5"]

[dependency-groups]
# python-dotenv lets the demo + gated tests pick up a local .env automatically
# (loaded at the entry points only — library code still just reads os.getenv).
dev = ["pytest>=8", "python-dotenv>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Default run stays offline and free: live/graph/jira tests opt in with `-m <marker>`.
addopts = "-q -m 'not live and not graph and not jira'"
markers = [
    "live: hits a real provider API (needs keys, costs money); excluded by default",
    "graph: needs a running Neo4j (docker compose up -d); excluded by default",
    "jira: needs the jira extra (httpx); live fetch additionally needs ATLASSIAN_* env",
    "observability: needs the observability extra (langfuse); excluded by default",
]
