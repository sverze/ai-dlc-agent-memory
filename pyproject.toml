[project]
name = "agentic-memory"
version = "0.1.0"
description = "Collective agentic memory for AI DLC — V1 prototype (Stage 1: substrate)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# Real provider SDKs — only needed to run against live models. The offline path
# (FakeModelClient + the full default test suite) imports without these.
live = ["anthropic>=0.40", "google-genai>=1.0"]
# Real temporal graph (L4) — Graphiti over Kuzu (embedded, local dev) or Neo4j
# (shared/demo via docker-compose). Offline path never needs these (D11).
graph = ["graphiti-core[kuzu]>=0.29"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Default run stays offline and free: live/graph tests opt in with `-m live` / `-m graph`.
addopts = "-q -m 'not live and not graph'"
markers = [
    "live: hits a real provider API (needs keys, costs money); excluded by default",
    "graph: needs a running Neo4j (docker compose up -d); excluded by default",
]
