[project]
name = "agentic-memory"
version = "0.1.0"
description = "Collective agentic memory for AI DLC — V1 prototype (Stage 1: substrate)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
